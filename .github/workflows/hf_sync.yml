name: Sync to Hugging Face

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Inject HF Config and Push
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.USERNAME }}
          HF_REPO: ${{ secrets.REPONAME }}
        run: |
          set -e  # stop on errors

          # 1. Build README safely (this only happens inside the runner)
          cat <<EOF > temp_readme.md
          ---
          title: Chatbot RAG Bot
          emoji: 🤖
          colorFrom: blue
          colorTo: green
          sdk: docker
          pinned: false
          ---

          EOF

          cat README.md >> temp_readme.md
          mv temp_readme.md README.md

          # 2. Git config
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # 3. Setup Hugging Face remote
          HF_URL="https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_REPO"

          if git remote | grep hf; then
            git remote set-url hf "$HF_URL"
          else
            git remote add hf "$HF_URL"
          fi

          # 4. Stage EVERYTHING (The Code + Modified README)
          git add .
          
          # Check if there are changes (avoids error if nothing changed)
          if git diff --cached --quiet; then
            echo "No changes to sync."
          else
            git commit -m "Sync: Full app update with metadata"
            git push -f hf main
          fi